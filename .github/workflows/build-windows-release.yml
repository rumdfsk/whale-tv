name: Build Windows release package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload package to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/WhaleTV-0.1.6-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  WhaleTV-0.1.6-win-x64.zip" | Out-File -FilePath "dist/WhaleTV-0.1.6-win-x64.zip.sha256" -Encoding ascii
          gh release upload v0.1.6 $zip "dist/WhaleTV-0.1.6-win-x64.zip.sha256" --repo $env:GITHUB_REPOSITORY --clobber
