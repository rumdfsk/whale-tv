name: Assemble Windows release package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download parts and verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: 10a60a8fb74897dd6dda6e5e4bac210a043b2551dea0e2345bbb563525613814
        run: |
          mkdir -p parts
          gh release download v0.1.6 --repo "$GITHUB_REPOSITORY" --pattern 'WhaleTV-win-x64.part-*' --dir parts
          cat parts/WhaleTV-win-x64.part-* > WhaleTV-0.1.6-win-x64.zip
          echo "$EXPECTED  WhaleTV-0.1.6-win-x64.zip" | sha256sum -c -

      - name: Upload assembled package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s  %s\n' "10a60a8fb74897dd6dda6e5e4bac210a043b2551dea0e2345bbb563525613814" "WhaleTV-0.1.6-win-x64.zip" > WhaleTV-0.1.6-win-x64.zip.sha256
          gh release upload v0.1.6 WhaleTV-0.1.6-win-x64.zip WhaleTV-0.1.6-win-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.6 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep '^WhaleTV-win-x64.part-' \
            | while read -r name; do
                gh release delete-asset v0.1.6 "$name" --repo "$GITHUB_REPOSITORY" --yes
              done
